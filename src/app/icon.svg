<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rainbow-ring" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="18%" stop-color="#ff9a3d" />
      <stop offset="34%" stop-color="#ffd84d" />
      <stop offset="52%" stop-color="#4dffa6" />
      <stop offset="68%" stop-color="#3de1ff" />
      <stop offset="84%" stop-color="#4d7cff" />
      <stop offset="100%" stop-color="#a35cff" />
    </linearGradient>
    <linearGradient id="rainbow-bar" x1="20" y1="22" x2="44" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3de1ff" />
      <stop offset="50%" stop-color="#4dffa6" />
      <stop offset="100%" stop-color="#a35cff" />
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#14213f" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
  </defs>

  <!-- Fundo escuro azulado -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-glow)" />
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="url(#rainbow-ring)" stroke-width="2.5" />

  <!-- Folha do currículo -->
  <path
    d="M21 15h16l8 8v25a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3Z"
    fill="#0a1226"
    stroke="#2b3f74"
    stroke-width="1.8"
    stroke-linejoin="round"
  />
  <path d="M37 15v6a2 2 0 0 0 2 2h6" stroke="#3de1ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Linhas do currículo com destaque arco-íris -->
  <rect x="23" y="27" width="16" height="3" rx="1.5" fill="url(#rainbow-bar)" />
  <rect x="23" y="34" width="18" height="2.4" rx="1.2" fill="#a3b0d4" opacity="0.85" />
  <rect x="23" y="40" width="13" height="2.4" rx="1.2" fill="#64739e" opacity="0.85" />

  <!-- Ponto orbital -->
  <circle cx="46" cy="46" r="4" fill="#04060c" stroke="url(#rainbow-ring)" stroke-width="2" />
</svg>

